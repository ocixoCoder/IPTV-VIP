name: Add German & US Streams

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iptv-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch, filter, append
        run: |
          set -e
          SOURCE="http://3serverx.com/get.php?username=2674385091&password=M43877654&type=m3u_plus&output=ts"

          curl -sL --max-time 90 -A "Mozilla/5.0" "$SOURCE" -o /tmp/source.m3u
          echo "Source lines: $(wc -l < /tmp/source.m3u)"

          awk '/^#EXTINF/{m=$0;next} /^http/&&m{print m"\t"$0; m=""}' /tmp/source.m3u \
            > /tmp/all.tsv
          echo "Total paired streams: $(wc -l < /tmp/all.tsv)"

          DE_PAT='german|germany|deutsch|\[de\]|\(de\)|zdf|ard|rtl|sat\.1|prosieben|kabel eins|vox|3sat|wdr|ndr|swr|mdr|sport1|dazn|sky sport|sky bundesliga|magenta sport|bundesliga|das erste|arte|phoenix|n-tv|welt|rtl2|sixx|nitro|tele 5|servus|orf|srfernsehen|hr-fernsehen|rbb|radiobremen|tagesschau'
          US_PAT='usa|united states|\[us\]|\(us\)|american|abc|nbc|cbs|fox news|cnn|espn|hbo|showtime|amc|tnt|tbs|usa network|syfy|bravo|discovery|history channel|nat geo|mtv|vh1|bet\b|pbs|the cw|starz|fx\b|fxx|comedy central|nickelodeon|cartoon network|adult swim'

          add_streams() {
            local pat="$1" target="$2" want="$3"
            echo "=== $target ==="

            [ -f "$target" ] || echo "#EXTM3U" > "$target"

            grep -iE "$pat" /tmp/all.tsv > /tmp/cand.tsv || true
            echo "  candidates: $(wc -l < /tmp/cand.tsv)"

            grep -oE 'http[^[:space:]]+' "$target" 2>/dev/null | sort -u > /tmp/have.txt || true
            awk -F'\t' 'NR==FNR{have[$0]=1;next} !($2 in have)' /tmp/have.txt /tmp/cand.tsv \
              > /tmp/fresh.tsv
            echo "  fresh: $(wc -l < /tmp/fresh.tsv)"

            shuf /tmp/fresh.tsv | head -n "$want" | tr '\t' '\n' >> "$target"
            echo "  appended up to $want"
          }

          add_streams "$DE_PAT" "DE.m3u" 10
          add_streams "$US_PAT" "US.m3u" 10

      - name: Debug — top group-titles (ignore if it works)
        run: |
          echo "Top 30 group-titles in source:"
          awk '/^#EXTINF/{m=$0;next} /^http/&&m{print m; m=""}' /tmp/source.m3u \
            | grep -oE 'group-title="[^"]*"' | sort | uniq -c | sort -rn | head -30

      - name: Commit
        run: |
          git config user.name "iptv-bot"
          git config user.email "bot@users.noreply.github.com"
          [ -f DE.m3u ] || echo "#EXTM3U" > DE.m3u
          [ -f US.m3u ] || echo "#EXTM3U" > US.m3u
          git add DE.m3u US.m3u
          git diff --cached --quiet && echo "no changes" || \
            (git commit -m "Add random German & US streams" && git push)
